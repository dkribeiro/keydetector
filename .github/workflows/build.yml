name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed for the release job to publish assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --target KeyDetector_All

      - name: Build tests
        run: cmake --build build --config Release --target KeyDetectorTests

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- packaging (only needed when releasing a tag) ----

      - name: Package macOS installer
        if: matrix.name == 'macos' && startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x packaging/macos/build_pkg.sh
          ./packaging/macos/build_pkg.sh "${GITHUB_REF_NAME#v}"

      - name: Package Windows installer
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            KeyDetector-macOS.pkg
            packaging/windows/Output/KeyDetector-Windows-Setup.exe
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: List downloaded files
        run: ls -laR dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KeyDetector ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.pkg
            dist/**/*.exe
          fail_on_unmatched_files: false
